security:
    enable_authenticator_manager: true
    
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        # API FIREWALL - MUST BE STATELESS
        api:
            pattern: ^/api
            stateless: true  # ← CRITICAL: No sessions for API
            provider: app_user_provider
            # If you want public API access (no auth):
            security: false  # ← Disable authentication for /api routes
            # OR if you want JWT/token auth:
            # jwt: ~
            # custom_authenticators:
            #     - App\Security\ApiTokenAuthenticator
        
        # WEB FIREWALL - Can use sessions
        main:
            pattern: ^/
            stateless: false  # ← Web can use sessions
            provider: app_user_provider
            custom_authenticator: App\Security\AppCustomAuthenticator
            logout:
                path: app_logout
                target: app_login
    
    access_control:
        # API endpoints - all public
        - { path: ^/api, roles: PUBLIC_ACCESS }
        
        # Web authentication
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email, roles: PUBLIC_ACCESS }
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        
        # Static pages (keep your existing list)
        - { path: ^/about, roles: PUBLIC_ACCESS }
        - { path: ^/contact, roles: PUBLIC_ACCESS }
        # ... rest of your static pages
        
        # Everything else requires authentication
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10